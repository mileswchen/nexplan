name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines: >=20; 24 is what the project is developed on.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The board IS a git repository: every write commits, and the tests assert
      # that history (document versions, activity feed, commit messages). A
      # runner has no reliable auto-detected identity, and the store deliberately
      # treats a failed commit as a warning rather than an error — so an identity
      # must be pinned here or those assertions would quietly stop testing anything.
      - name: Configure git identity
        run: |
          git config --global user.name "nexplan-ci"
          git config --global user.email "ci@nexplan.invalid"

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
