<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NexPlan Project Management</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --border: #2b3040;
    --text: #e6e8ee; --muted: #8a90a3; --accent: #4f8cff; --accent2: #6f5cff;
    --green: #35c26a; --yellow: #f5b942; --red: #f2545b; --cyan: #37b6d6; --magenta: #c66fe0;
    --radius: 10px;
  }
  /* Light theme (toggle via #theme-btn; persists in localStorage). */
  html[data-theme="light"] {
    --bg: #f4f6fb; --panel: #ffffff; --panel2: #eef1f7; --border: #d6dbe6;
    --text: #24272f; --muted: #676f7d; --accent: #2f6bff; --accent2: #6f5cff;
    --green: #15803d; --yellow: #b45309; --red: #dc2626; --cyan: #0e7490; --magenta: #a21caf;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }
  .muted { color: var(--muted); }
  .top { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .proj { display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
  .proj .muted { white-space: nowrap; }
  .proj select { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; }
  .chip b { color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin-left: auto; }
  .tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 7px 16px;
    border-radius: 999px; cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 6px 14px;
    border-radius: 8px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.danger { color: var(--red); border-color: var(--red); }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .lang { width: auto; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-left: 6px; }
  main { padding: 18px 20px; max-width: 1400px; margin: 0 auto; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .col { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px;
    min-height: 120px; }
  .col h3 { margin: 4px 6px 10px; font-size: 13px; font-weight: 600; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center; }
  .col h3 .count { font-weight: 700; color: var(--text); }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
    margin-bottom: 9px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card .id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent); }
  .card .title { margin: 4px 0; font-weight: 500; line-height: 1.35; }
  .card .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
  .badge { padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .pri-P0 { background: rgba(242,84,91,.16); color: var(--red); }
  .pri-P1 { background: rgba(245,185,66,.16); color: var(--yellow); }
  .pri-P2 { background: rgba(55,182,214,.16); color: var(--cyan); }
  .pri-P3 { background: rgba(138,144,163,.16); color: var(--muted); }
  .sev-critical { background: rgba(242,84,91,.18); color: var(--red); }
  .sev-major { background: rgba(245,185,66,.18); color: var(--yellow); }
  .sev-minor { background: rgba(55,182,214,.18); color: var(--cyan); }
  .sev-trivial { background: rgba(138,144,163,.18); color: var(--muted); }
  .st { font-size: 11px; }
  .st.backlog,.st.todo,.st.open { color: var(--muted); }
  .st.in_progress { color: var(--yellow); }
  .st.review { color: var(--cyan); }
  .st.done,.st.fixed,.st.verified { color: var(--green); }
  .st.blocked,.st.wontfix { color: var(--red); }
  .assignee { color: var(--magenta); font-size: 12px; }
  .tag { color: var(--muted); font-size: 12px; }
  .docview, .card-doc { color: var(--accent); cursor: pointer; }
  .docview { color: var(--accent); cursor: pointer; font-size: 12px; max-width: 55%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-doc { margin-left: auto; font-size: 13px; text-decoration: none; }
  .role-admin { color: var(--red); } .role-member { color: var(--cyan); } .role-viewer { color: var(--muted); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 8px; font-size: 13px; height: 38px; width: 210px; flex: 0 0 auto; }
  .toolbar .spacer { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; }
  .list-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .list-item:hover { background: var(--panel2); }
  .list-item.active { background: var(--panel2); border: 1px solid var(--accent); }
  .doc-body { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.55;
    min-height: 240px; }
  textarea, input[type=text], select { width: 100%; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 8px; font-family: inherit; font-size: 13px; }
  textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; }
  /* Inline doc editor: split markdown editor / live preview side by side. */
  .doc-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
  .doc-edit-grid textarea { min-height: 420px; resize: vertical; }
  .doc-edit-grid .md { min-height: 420px; max-height: 560px; overflow: auto; padding: 10px 12px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; }
  @media (max-width: 800px) { .doc-edit-grid { grid-template-columns: 1fr; } }
  .mermaid { text-align: center; margin: 12px 0; overflow-x: auto; }
  .md .mermaid svg { max-width: 100%; height: auto; }
  label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 12px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center;
    justify-content: center; z-index: 100; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 620px;
    max-width: 100%; max-height: 90vh; overflow: auto; padding: 18px; }
  .modal.wide { width: 860px; }
  .modal h3 { margin: 0 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .note { border-left: 2px solid var(--accent); padding: 6px 10px; margin: 6px 0; background: var(--panel2);
    border-radius: 0 6px 6px 0; font-size: 13px; }
  .note .who { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 18px; }
  .hidden { display: none !important; }
  .diff { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  table.admin { width: 100%; border-collapse: collapse; }
  table.admin th, table.admin td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  table.admin th { color: var(--muted); font-weight: 600; font-size: 12px; }
  #toast { position: fixed; top: 16px; right: 16px; z-index: 999; max-width: 380px;
    background: var(--panel2); border: 1px solid var(--red); color: var(--text); padding: 10px 14px;
    border-radius: 8px; font-size: 13px; box-shadow: 0 4px 18px rgba(0,0,0,.4); display: none;
    white-space: pre-wrap; }
  #toast.show { display: block; }
  /* Rendered markdown (documents) */
  .md { line-height: 1.7; font-size: 14px; word-wrap: break-word; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 18px 0 8px; line-height: 1.3; }
  .md h1 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .md h2 { font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .md h3 { font-size: 15px; } .md h4 { font-size: 14px; }
  .md h1:first-child, .md h2:first-child { margin-top: 0; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 26px; }
  .md li { margin: 3px 0; }
  .md ul ul, .md ol ol, .md ul ol, .md ol ul { margin: 3px 0; }
  .md code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
    background: rgba(127,127,127,.15); padding: 1px 5px; border-radius: 4px; }
  .md pre.code { background: rgba(127,127,127,.12); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
    line-height: 1.5; margin: 10px 0; }
  .md pre.code code { background: none; padding: 0; font-size: inherit; }
  .md blockquote { margin: 10px 0; padding: 2px 14px; border-left: 3px solid var(--accent);
    color: var(--muted); background: rgba(127,127,127,.08); border-radius: 0 6px 6px 0; }
  .md blockquote p { margin: 6px 0; }
  .md table { border-collapse: collapse; margin: 10px 0; max-width: 100%; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md th { background: var(--panel2); font-weight: 600; }
  .md tr:nth-child(even) td { background: rgba(127,127,127,.05); }
  .md a { color: var(--accent); }
  .md img { max-width: 100%; border-radius: 6px; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
  .md del { color: var(--muted); }
</style>
</head>
<body>
<div class="top">
  <div class="brand">Nex<span>Plan</span></div>
  <div class="proj"><span class="muted" data-i18n="proj_label">Project</span><select id="project-select"></select></div>
  <div class="chips" id="chips"></div>
  <div class="tabs">
    <button class="tab active" data-tab="board" data-i18n="tab_board">Board</button>
    <button class="tab" data-tab="bugs" data-i18n="tab_bugs">Bugs</button>
    <button class="tab" data-tab="tests" data-i18n="tab_tests">Tests</button>
    <button class="tab" data-tab="docs" data-i18n="tab_docs">Docs</button>
    <button class="tab" data-tab="admin" data-i18n="tab_admin">Admin</button>
  </div>
  <select id="lang-select" class="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="zh">中文</option>
  </select>
  <button class="btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
  <button class="btn" id="login-btn">Log in</button>
  <span class="muted" id="whoami" style="display:none"></span>
  <button class="btn" id="logout-btn" style="display:none">Log out</button>
  <button class="btn" id="refresh" data-i18n="refresh">Refresh</button>
</div>

<main>
  <!-- BOARD -->
  <section id="view-board">
    <div class="toolbar">
      <input id="q" data-i18n-ph="search_wi_ph" placeholder="Search title/description…" />
      <select id="filter-priority"><option value="" data-i18n="all_priorities">All priorities</option>
        <option>P0</option><option>P1</option><option>P2</option><option>P3</option></select>
      <select id="filter-assignee"><option value="" data-i18n="all_assignees">All assignees</option></select>
      <div class="spacer"></div>
      <button class="btn primary" id="new-item" data-i18n="new_item">+ New work item</button>
    </div>
    <div class="board" id="board"></div>
  </section>

  <!-- BUGS -->
  <section id="view-bugs" class="hidden">
    <div class="toolbar">
      <input id="bq" data-i18n-ph="search_bug_ph" placeholder="Search bugs…" />
      <select id="b-severity"><option value="" data-i18n="all_severities">All severities</option>
        <option>critical</option><option>major</option><option>minor</option><option>trivial</option></select>
      <select id="b-status"><option value="" data-i18n="all_statuses">All statuses</option>
        <option>open</option><option>in_progress</option><option>fixed</option><option>verified</option><option>wontfix</option></select>
      <div class="spacer"></div>
      <button class="btn primary" id="new-bug" data-i18n="new_bug">+ Add bug</button>
    </div>
    <div class="panel" id="bug-list"></div>
  </section>

  <!-- TESTS -->
  <section id="view-tests" class="hidden">
    <div class="toolbar">
      <input id="tq" data-i18n-ph="search_case_ph" placeholder="Search test cases…" />
      <select id="t-status"><option value="" data-i18n="all_statuses">All statuses</option>
        <option value="active">active</option><option value="draft">draft</option><option value="deprecated">deprecated</option></select>
      <select id="t-result"><option value="" data-i18n="all_results">All results</option>
        <option value="pass">pass</option><option value="fail">fail</option><option value="blocked">blocked</option>
        <option value="skipped">skipped</option><option value="notRun">notRun</option></select>
      <select id="t-priority"><option value="" data-i18n="all_priorities">All priorities</option>
        <option>P0</option><option>P1</option><option>P2</option><option>P3</option></select>
      <div class="spacer"></div>
      <button class="btn" id="t-report" data-i18n="test_report">📊 Report</button>
      <button class="btn primary" id="new-case" data-i18n="new_case">+ New test case</button>
    </div>
    <div class="grid2">
      <div class="panel" id="case-list"></div>
      <div class="panel" id="case-view"><div class="empty" data-i18n="case_select_empty">Select a test case on the left</div></div>
    </div>
  </section>

  <!-- DOCS -->
  <section id="view-docs" class="hidden">
    <div class="toolbar">
      <button class="btn primary" id="new-doc" data-i18n="new_doc">+ New doc</button>
    </div>
    <div class="grid2">
      <div class="panel" id="doc-list"></div>
      <div class="panel" id="doc-view"><div class="empty" data-i18n="doc_select_empty">Select a document on the left</div></div>
    </div>
  </section>

  <!-- ADMIN -->
  <section id="view-admin" class="hidden">
    <div class="panel" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0" data-i18n="project_stats">Project statistics</h2>
        <button class="btn" id="perm-toggle">Permissions</button>
      </div>
      <div class="board" id="project-stats" style="margin-top:12px"></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <h2 data-i18n="projects">Projects</h2>
        <button class="btn primary sm" id="new-project" data-i18n="new_project">+ New project</button>
        <table class="admin" style="margin-top:10px" id="project-table"></table>
      </div>
      <div class="panel">
        <h2 data-i18n="users">Users</h2>
        <button class="btn primary sm" id="new-user" data-i18n="new_user">+ Add user</button>
        <table class="admin" style="margin-top:10px" id="user-table"></table>
      </div>
    </div>
  </section>
</main>

<!-- work item modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>
<div id="toast"></div>

const LS_LANG = 'nexplan_lang';
const detectLang = () => {
  const saved = localStorage.getItem(LS_LANG);
  if (saved === 'en' || saved === 'zh') return saved;
  return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
};
let lang = detectLang();
const t = (key) => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
const statusLabel = (s) => (I18N.en['st_' + s] ? t('st_' + s) : s);
const fmt = (key, vars) => { let s = t(key); for (const k in (vars || {})) s = s.replace('{' + k + '}', vars[k]); return s; };
function applyI18n() {
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = t(el.getAttribute('data-i18n')); if (v) el.textContent = v; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { const v = t(el.getAttribute('data-i18n-ph')); if (v) el.setAttribute('placeholder', v); });
}
function setLang(next) {
  if (next !== 'en' && next !== 'zh') return;
  lang = next;
  localStorage.setItem(LS_LANG, next);
  document.documentElement.lang = next === 'zh' ? 'zh-CN' : 'en';
  const sel = $('#lang-select'); if (sel) sel.value = next;
  applyI18n();
  renderAuth();
  refresh();
}

// Surface API/validation errors as a toast instead of failing silently.
let toastTimer = null;
function notify(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}
function notifyError(e) {
  const msg = (e && e.message) || String(e);
  console.error(msg);
  notify('Error: ' + msg);
}

const api = {
  get: (u) => fetch(u, { credentials: 'same-origin' }).then(r => { if (!r.ok) return r.json().then(x => { throw new Error(x.error || r.statusText); }); return r.json(); }).catch(e => { notifyError(e); throw e; }),
  send: (u, method, body) => fetch(u, { method, credentials: 'same-origin', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body || {}) }).then(r => { if (!r.ok) return r.json().then(x => { throw new Error(x.error || r.statusText); }); return r.json(); }).catch(e => { notifyError(e); throw e; }),
};

// A design-document link can be an external URL, a bare NexPlan doc slug, or a
// reference like "slug=<slug>" / "doc=<slug>". Normalize these before use.
function docIsExternal(v) { return /^https?:\/\//i.test(v) || /^mailto:/i.test(v); }
function extractDocSlug(v) {
  const m = /^(?:slug|doc|docs?)\s*=\s*(.+)$/i.exec(v.trim());
  return (m ? m[1] : v).trim().replace(/\.md$/i, '');
}
function resolveDocLinkValue(v) {
  v = String(v || '').trim();
  if (!v) return null;
  if (docIsExternal(v)) return { external: v };
  return { slug: extractDocSlug(v), raw: v };
}
// Compare a doc slug/title loosely (ignore case, spaces, hyphens, underscores, dots).
function normDocRef(s) { return String(s || '').toLowerCase().replace(/[\s_.\-]+/g, ''); }
async function listDocs(proj) {
  try { return (await api.get('/api/docs?project=' + encodeURIComponent(proj))) || []; }
  catch (e) { return []; }
}
// Locate a NexPlan doc for a link reference. Tries the current project first
// (by exact slug, then by normalized slug/title), then falls back to other
// projects so a doc referenced from a different project still opens.
async function findNexplanDoc(raw) {
  const ref = extractDocSlug(raw);
  if (!ref) return null;
  const byRef = (d) =>
    d.slug === ref ||
    normDocRef(d.slug) === normDocRef(ref) ||
    normDocRef(d.meta.title) === normDocRef(ref);
  const current = await listDocs(project);
  const hit = (current || []).find(byRef);
  if (hit) return hit;
  // The list may be the source of truth but a single-fetch can still resolve.
  try {
    const doc = await api.get('/api/docs/' + encodeURIComponent(ref) + '?project=' + encodeURIComponent(project));
    if (doc && doc.slug) return doc;
  } catch (e) { /* keep looking */ }
  try {
    const w = await api.get('/api/workspace');
    for (const p of (w.projects || [])) {
      if (String(p.key) === project) continue;
      const found = (await listDocs(p.key)).find(byRef);
      if (found) return found;
    }
  } catch (e) { /* allow the caller to show a clear message */ }
  return null;
}
async function openDocLink(v) {
  const norm = resolveDocLinkValue(v);
  if (!norm) return;
  if (norm.external) { window.open(norm.external, '_blank', 'noopener'); return; }
  // A "slug=<https://...>" reference is really an external URL.
  if (docIsExternal(norm.slug)) { window.open(norm.slug, '_blank', 'noopener'); return; }
  const doc = await findNexplanDoc(norm.raw || norm.slug);
  if (doc) { openDocModal(doc); return; }
  // Never navigate to the dashboard shell: report clearly instead.
  notify(t('doc_not_found') + '：' + (norm.raw || norm.slug));
}
function openDocModal(doc) {
  const modal = $('#modal');
  modal.innerHTML = `
    <h3>${esc(doc.meta.title)} <span class="muted">${esc(doc.slug)} · v${doc.meta.version}</span></h3>
    <div class="md">${renderMarkdown(doc.content)}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="doc-modal-close">${t('close')}</button></div>`;
  $('.modal-bg').classList.add('open');
  $('#doc-modal-close').onclick = closeModal;
  renderMermaid();
}

// [md renderer] Self-contained, dependency-free, XSS-safe markdown → HTML.
function escMd(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function mdUrl(u) {
  u = String(u).trim();
  // Only allow safe URL schemes / anchors / relative paths, no quotes/spaces.
  return /^(https?:|mailto:|#|\/|\.\.?\/)/i.test(u) && !/[\s"'<>]/.test(u) ? escMd(u) : '#';
}
function mdInline(t) {
  const images = [];
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) => {
    images.push(`<img src="${mdUrl(src)}" alt="${escMd(alt)}" loading="lazy" />`);
    return `\u0001${images.length - 1}\u0001`;
  });
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) =>
    `<a href="${mdUrl(url)}" target="_blank" rel="noopener">${label}</a>`);
  t = t.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return t.replace(/\u0001(\d+)\u0001/g, (_, i) => images[+i]);
}

/** Build a <ul>/<ol> starting at lines[i]. Items at `base` indentation level;
 *  deeper-indented marker lines become nested lists. Returns { html, next }. */
function mdList(lines, i) {
  const first = /^(\s*)([-*+]|\d+\.)[ \t]+/.exec(lines[i]);
  if (!first) return { html: '', next: i };
  const base = first[1].length;
  let kind = /^\d/.test(first[2]) ? 'ol' : 'ul';
  const items = [];
  while (i < lines.length) {
    const m = /^(\s*)([-*+]|\d+\.)[ \t]+(.*)$/.exec(lines[i]);
    if (!m) break;
    const ind = m[1].length;
    if (ind < base) break;
    if (ind === base) {
      const cur = /^\d/.test(m[2]) ? 'ol' : 'ul';
      if (cur !== kind) break; // switching bullet ↔ number ends this list
      let j = i + 1;
      const deep = [];
      while (j < lines.length) {
        const dm = /^(\s*)([-*+]|\d+\.)[ \t]+/.exec(lines[j]);
        if (dm && dm[1].length > base) { deep.push(lines[j]); j++; } else break;
      }
      const inner = deep.length ? mdList(deep, 0).html : '';
      items.push(`<li>${mdInline(escMd(m[3]))}${inner}</li>`);
      i = j;
    } else {
      break; // deeper line without a parent item: stop
    }
  }
  return { html: `<${kind}>${items.join('')}</${kind}>`, next: i };
}

/** Turn markdown text into (already HTML-escaped) block HTML. */
function renderMarkdown(src) {
  const text = String(src || '').replace(/\r\n?/g, '\n').replace(/^\uFEFF/, '');
  if (!text.trim()) return '';
  // Ignore an accidental YAML frontmatter block (content is normally body-only).
  const lines = text.split('\n');
  const html = [];
  let i = 0, para = [];
  const flushPara = () => {
    if (!para.length) return;
    html.push(`<p>${mdInline(escMd(para.join(' ')))}</p>`);
    para = [];
  };
  while (i < lines.length) {
    const line = lines[i];
    const tline = line.trim();
    if (!tline) { flushPara(); i++; continue; }

    // fenced code block
    if (/^```/.test(tline)) {
      flushPara();
      const lang = (/^```(\S*)/.exec(tline) || [])[1] || '';
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }
      i++; // skip closing fence
      const code = buf.join('\n');
      if (lang === 'mermaid') {
        html.push(`<div class="mermaid"><pre class="code"><code>${escMd(code)}</code></pre></div>`);
      } else {
        html.push(`<pre class="code"><code>${escMd(code)}</code></pre>`);
      }
      continue;
    }
    // ATX heading
    const h = /^(#{1,6})\s+(.*)$/.exec(tline);
    if (h) { flushPara(); html.push(`<h${h[1].length}>${mdInline(escMd(h[2]))}</h${h[1].length}>`); i++; continue; }
    // horizontal rule
    if (/^([-*_])\1{2,}$/.test(tline)) { flushPara(); html.push('<hr />'); i++; continue; }
    // blockquote (consecutive > lines)
    if (tline.startsWith('>')) {
      flushPara();
      const buf = [];
      while (i < lines.length && lines[i].trim().startsWith('>')) {
        buf.push(lines[i].trim().replace(/^>\s?/, ''));
        i++;
      }
      html.push(`<blockquote>${mdInline(escMd(buf.join(' ')))}</blockquote>`);
      continue;
    }
    // list (top-level marker without leading indentation; nesting handled by mdList)
    if (/^([-*+]|\d+\.)[ \t]+/.test(line)) {
      flushPara();
      const r = mdList(lines, i);
      html.push(r.html);
      i = r.next;
      continue;
    }
    // table (header line + separator line)
    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      flushPara();
      const splitRow = (r) => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
      const head = splitRow(lines[i]);
      let j = i + 2;
      const rows = [];
      while (j < lines.length && lines[j].includes('|')) { rows.push(splitRow(lines[j])); j++; }
      html.push('<table><thead><tr>' + head.map((c) => `<th>${mdInline(escMd(c))}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map((r) => '<tr>' + r.map((c) => `<td>${mdInline(escMd(c))}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      i = j;
      continue;
    }
    para.push(line);
    i++;
  }
  flushPara();
  return html.join('\n');
}
// [/md renderer]

// ---------------- Mermaid diagrams ----------------
// Mermaid is not bundled (the app is otherwise dependency-free); it is loaded
// lazily from a CDN the first time a ```mermaid block appears, and never blocks
// the page. If the load or render fails (e.g. offline, or invalid diagram
// syntax), the raw fenced code block is left in place as readable fallback.
let _mermaidPromise = null;
function mermaidTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'default' : 'dark';
}
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (_mermaidPromise) return _mermaidPromise;
  _mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
    s.onload = () => {
      try {
        window.mermaid.initialize({ startOnLoad: false, theme: mermaidTheme(), securityLevel: 'strict' });
        resolve(window.mermaid);
      } catch (e) {
        reject(e);
      }
    };
    s.onerror = () => reject(new Error('mermaid.js failed to load'));
    document.head.appendChild(s);
  });
  return _mermaidPromise;
}
let _mermaidSeq = 0;
async function renderMermaid() {
  const els = document.querySelectorAll('.mermaid:not([data-mermaid-done])');
  if (!els.length) return;
  let mermaid;
  try {
    mermaid = await loadMermaid();
  } catch (e) {
    // Offline / CDN unreachable: leave the raw code block visible.
    console.warn('[nexplan] mermaid unavailable:', e && e.message);
    els.forEach((el) => el.setAttribute('data-mermaid-done', '1'));
    return;
  }
  for (const el of els) {
    el.setAttribute('data-mermaid-done', '1');
    const code = el.textContent;
    if (!code.trim()) continue;
    try {
      const id = 'mmd-' + Date.now().toString(36) + '-' + (++_mermaidSeq);
      const { svg } = await mermaid.render(id, code);
      el.innerHTML = svg;
      el.classList.add('rendered');
    } catch (e) {
      // Invalid syntax: keep the readable code fallback.
      console.warn('[nexplan] mermaid render failed:', e && e.message, code);
    }
  }
}

async function openDoc(slug) {
  const s = encodeURIComponent(slug);
  const q = 'project=' + encodeURIComponent(project);
  const d = await api.get('/api/docs/' + s + '?' + q);
  const hist = await api.get('/api/docs/' + s + '/history?' + q);
  const comments = await api.get('/api/docs/' + s + '/comments?' + q);
  const canEdit = await canEditDocs();
  $('#doc-view').innerHTML = `
    <div class="row">
      <h2 style="margin:0">${esc(d.meta.title)}</h2>
      <span class="muted">${esc(slug)} · v${d.meta.version}</span>
      <span class="st">${esc(d.meta.status)}</span>
    </div>
    <div class="row" style="margin:10px 0">
      ${canEdit
        ? `<button class="btn sm" id="doc-edit">${t('doc_edit')}</button>
           <button class="btn sm" id="doc-status">${t('doc_approve')}</button>`
        : `<span class="muted">${t('doc_readonly')}</span>`}
    </div>
    <div class="md" id="doc-content">${renderMarkdown(d.content)}</div>
    <h3 style="margin:16px 0 8px">${t('doc_history')}</h3>
    <div class="doc-body" style="min-height:auto">${hist.map(v => `v${v.version} · ${v.sha.slice(0,8)} · ${esc(v.author)} · ${esc(new Date(v.date).toLocaleString())}<br>${esc(v.message)}`).join('<br><br>') || t('doc_no_versions')}</div>
    <h3 style="margin:16px 0 8px">${t('doc_comments')} <span class="count">${comments.length}</span></h3>
    <div id="doc-comments">${comments.map(c => `<div class="note">${esc(c.body)} <span class="who">— ${esc(c.author)} ${esc(new Date(c.at).toLocaleString())}</span></div>`).join('') || `<div class="empty">${t('doc_no_comments')}</div>`}</div>
    ${canEdit ? `<div class="row" style="margin-top:10px"><input type="text" id="comment-input" placeholder="${t('doc_comment_ph')}" /><button class="btn" id="comment-add">${t('doc_comment_add')}</button></div>` : ''}`;
  const editBtn = $('#doc-edit');
  if (editBtn) editBtn.onclick = () => editDocInline(slug, d.content, d.meta);
  const statusBtn = $('#doc-status');
  if (statusBtn) statusBtn.onclick = async () => {
    await api.send('/api/docs/' + s + '?' + q, 'PATCH', { status: 'approved', author: 'user' });
    await openDoc(slug); await refresh();
  };
  const commentInput = $('#comment-input');
  if (commentInput) $('#comment-add').onclick = async () => {
    const v = commentInput.value.trim();
    if (!v) return;
    await api.send('/api/docs/' + s + '/comments?' + q, 'POST', { body: v, author: 'user' });
    await openDoc(slug); await refresh();
  };
  renderMermaid();
}

// Whether the logged-in user may edit documents in the current project. Mirrors
// the server's write gate: admins always can; viewers never can; a rostered
// project additionally requires membership; an open (empty) project is public.
async function canEditDocs() {
  if (!currentUser) return false;
  if (currentUser.role === 'viewer') return false;
  if (currentUser.role === 'admin') return true;
  try {
    const w = await api.get('/api/workspace');
    const p = (w.projects || []).find(x => x.key === project);
    if (!p) return false;
    if (!(p.members || []).length) return true; // open project → public
    return p.members.includes(currentUser.id);
  } catch {
    return false;
  }
}

// Inline editor: markdown textarea on the left, live-rendered preview on the
// right. Saving PATCHes a new version in place (no modal).
function editDocInline(slug, content, meta) {
  const s = encodeURIComponent(slug);
  const q = 'project=' + encodeURIComponent(project);
  $('#doc-view').innerHTML = `
    <div class="row">
      <h2 style="margin:0">${esc(meta.title)}</h2>
      <span class="muted">${esc(slug)} · v${meta.version} → ${t('doc_edit_title')}</span>
      <span class="st">${esc(meta.status)}</span>
    </div>
    <div class="doc-edit-grid" style="margin-top:10px">
      <textarea id="doc-md" placeholder="${t('doc_content')}">${esc(content)}</textarea>
      <div class="md" id="doc-preview">${renderMarkdown(content)}</div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="doc-cancel">${t('cancel')}</button>
      <button class="btn primary" id="doc-save">${t('doc_save_version')}</button>
      <span class="muted" style="align-self:center">${esc(slug)}</span>
    </div>`;
  const md = $('#doc-md');
  const debouncedMermaid = debounce(renderMermaid, 200);
  md.oninput = () => {
    $('#doc-preview').innerHTML = renderMarkdown(md.value);
    debouncedMermaid();
  };
  $('#doc-cancel').onclick = () => openDoc(slug);
  $('#doc-save').onclick = async () => {
    await api.send('/api/docs/' + s + '?' + q, 'PATCH', { content: md.value, author: 'user' });
    await openDoc(slug); await refresh();
  };
  renderMermaid();
  md.focus();
}

let caseStatsByItem = {};
let openCaseId = null;

const dt = (iso) => (iso ? new Date(iso).toLocaleString() : '-');
const resultBadge = (r) => {
  const cls = r === 'pass' ? 'st done' : r === 'fail' ? 'st blocked' : r ? 'st review' : 'st backlog';
  return `<span class="${cls}">${esc(r || t('case_none'))}</span>`;
};

/** Per-work-item case stats, fetched once per board render for card badges. */
async function loadCaseStatsByItem() {
  const cases = await api.get('/api/testcases?project=' + encodeURIComponent(project));
  caseStatsByItem = {};
  for (const c of cases) {
    if (!c.workItem) continue;
    const s = caseStatsByItem[c.workItem] || { total: 0, pass: 0, fail: 0, notRun: 0 };
    s.total++;
    if (c.lastResult === 'pass') s.pass++;
    else if (c.lastResult === 'fail') s.fail++;
    else if (!c.lastResult) s.notRun++;
    caseStatsByItem[c.workItem] = s;
  }
}

function caseStatsBadge(itemId) {
  const s = caseStatsByItem[itemId];
  if (!s || !s.total) return '';
  const cls = s.fail ? 'sev-critical' : s.pass === s.total ? 'pri-P3' : 'pri-P2';
  const icon = s.fail ? '❌' : s.pass === s.total ? '✅' : '◻';
  return `<span class="badge ${cls}" title="${s.pass} pass / ${s.fail} fail / ${s.notRun} not run">${icon} ${s.pass}/${s.total}</span>`;
}

async function deleteCase(c) {
  if (!confirm(fmt('confirm_del_case', { x: c.id }))) return;
  try {
    await api.send(`/api/testcases/${encodeURIComponent(c.id)}?project=${encodeURIComponent(project)}`, 'DELETE', {});
  } catch (e) {
    if (!String(e.message || '').includes('execution record')) return;
    if (!confirm(t('force_del_case'))) return;
    await api.send(`/api/testcases/${encodeURIComponent(c.id)}?project=${encodeURIComponent(project)}&force=1`, 'DELETE', {});
  }
  openCaseId = null;
  $('#case-view').innerHTML = `<div class="empty">${t('case_select_empty')}</div>`;
  await refresh();
}

function parseSteps(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf('|');
    return i === -1 ? { action: l, expected: '' } : { action: l.slice(0, i).trim(), expected: l.slice(i + 1).trim() };
  });
}

let currentUser = null;

    li.style.display = 'none';
    who.style.display = 'inline-flex';
    who.textContent = `${currentUser.name} (${currentUser.role})`;
    lo.style.display = 'inline-flex';
  } else {
    li.style.display = 'inline-flex';
    li.classList.add('primary');
    who.style.display = 'none';
    lo.style.display = 'none';
  }
}

  try {
    const r = await api.get('/api/auth/me');
    currentUser = r && r.user ? r.user : null;
  } catch {
    currentUser = null;
  }
  renderAuth();
  return currentUser;
}

// ---- theme (dark default / light toggle, persisted) ----
const LS_THEME = 'nexplan_theme';
function currentTheme() { return localStorage.getItem(LS_THEME) === 'light' ? 'light' : 'dark'; }
function applyTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  localStorage.setItem(LS_THEME, th);
  const b = $('#theme-btn');
  if (b) b.textContent = th === 'light' ? '☀️' : '🌙';
}
$('#theme-btn').onclick = () => applyTheme(currentTheme() === 'light' ? 'dark' : 'light');
applyTheme(currentTheme());

document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
$('#lang-select').value = lang;
applyI18n();
initProjects().then(refresh);
checkAuth().then((u) => { if (u && u.mustChangePassword) changePasswordForm(); });
setInterval(() => { if (!document.hidden) refresh(); }, 15000);
</script>
</body>
</html>
