<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NexPlan Project Management</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --border: #2b3040;
    --text: #e6e8ee; --muted: #8a90a3; --accent: #4f8cff; --accent2: #6f5cff;
    --green: #35c26a; --yellow: #f5b942; --red: #f2545b; --cyan: #37b6d6; --magenta: #c66fe0;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }
  .muted { color: var(--muted); }
  .top { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .proj { display: flex; align-items: center; gap: 6px; }
  .proj select { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; }
  .chip b { color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin-left: auto; }
  .tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 7px 16px;
    border-radius: 999px; cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 6px 14px;
    border-radius: 8px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.danger { color: var(--red); border-color: var(--red); }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .lang { width: auto; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-left: 6px; }
  main { padding: 18px 20px; max-width: 1400px; margin: 0 auto; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .col { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px;
    min-height: 120px; }
  .col h3 { margin: 4px 6px 10px; font-size: 13px; font-weight: 600; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center; }
  .col h3 .count { font-weight: 700; color: var(--text); }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
    margin-bottom: 9px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card .id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--accent); }
  .card .title { margin: 4px 0; font-weight: 500; line-height: 1.35; }
  .card .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
  .badge { padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .pri-P0 { background: rgba(242,84,91,.16); color: var(--red); }
  .pri-P1 { background: rgba(245,185,66,.16); color: var(--yellow); }
  .pri-P2 { background: rgba(55,182,214,.16); color: var(--cyan); }
  .pri-P3 { background: rgba(138,144,163,.16); color: var(--muted); }
  .sev-critical { background: rgba(242,84,91,.18); color: var(--red); }
  .sev-major { background: rgba(245,185,66,.18); color: var(--yellow); }
  .sev-minor { background: rgba(55,182,214,.18); color: var(--cyan); }
  .sev-trivial { background: rgba(138,144,163,.18); color: var(--muted); }
  .st { font-size: 11px; }
  .st.backlog,.st.todo,.st.open { color: var(--muted); }
  .st.in_progress { color: var(--yellow); }
  .st.review { color: var(--cyan); }
  .st.done,.st.fixed,.st.verified { color: var(--green); }
  .st.blocked,.st.wontfix { color: var(--red); }
  .assignee { color: var(--magenta); font-size: 12px; }
  .tag { color: var(--muted); font-size: 12px; }
  .role-admin { color: var(--red); } .role-member { color: var(--cyan); } .role-viewer { color: var(--muted); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  .toolbar .spacer { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; }
  .list-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .list-item:hover { background: var(--panel2); }
  .list-item.active { background: var(--panel2); border: 1px solid var(--accent); }
  .doc-body { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.55;
    min-height: 240px; }
  textarea, input[type=text], select { width: 100%; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 8px; font-family: inherit; font-size: 13px; }
  textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; }
  label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 12px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center;
    justify-content: center; z-index: 100; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 620px;
    max-width: 100%; max-height: 90vh; overflow: auto; padding: 18px; }
  .modal.wide { width: 860px; }
  .modal h3 { margin: 0 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .note { border-left: 2px solid var(--accent); padding: 6px 10px; margin: 6px 0; background: var(--panel2);
    border-radius: 0 6px 6px 0; font-size: 13px; }
  .note .who { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 18px; }
  .hidden { display: none !important; }
  .diff { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  table.admin { width: 100%; border-collapse: collapse; }
  table.admin th, table.admin td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  table.admin th { color: var(--muted); font-weight: 600; font-size: 12px; }
  #toast { position: fixed; top: 16px; right: 16px; z-index: 999; max-width: 380px;
    background: var(--panel2); border: 1px solid var(--red); color: var(--text); padding: 10px 14px;
    border-radius: 8px; font-size: 13px; box-shadow: 0 4px 18px rgba(0,0,0,.4); display: none;
    white-space: pre-wrap; }
  #toast.show { display: block; }
</style>
</head>
<body>
<div class="top">
  <div class="brand">Nex<span>Plan</span></div>
  <div class="proj"><span class="muted" data-i18n="proj_label">Project</span><select id="project-select"></select></div>
  <div class="chips" id="chips"></div>
  <div class="tabs">
    <button class="tab active" data-tab="board" data-i18n="tab_board">Board</button>
    <button class="tab" data-tab="bugs" data-i18n="tab_bugs">Bugs</button>
    <button class="tab" data-tab="docs" data-i18n="tab_docs">Docs</button>
    <button class="tab" data-tab="admin" data-i18n="tab_admin">Admin</button>
  </div>
  <select id="lang-select" class="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="zh">中文</option>
  </select>
  <button class="btn" id="login-btn">Log in</button>
  <span class="muted" id="whoami" style="display:none"></span>
  <button class="btn" id="logout-btn" style="display:none">Log out</button>
  <button class="btn" id="refresh" data-i18n="refresh">Refresh</button>
</div>

<main>
  <!-- BOARD -->
  <section id="view-board">
    <div class="toolbar">
      <input id="q" data-i18n-ph="search_wi_ph" placeholder="Search title/description…" />
      <select id="filter-priority"><option value="" data-i18n="all_priorities">All priorities</option>
        <option>P0</option><option>P1</option><option>P2</option><option>P3</option></select>
      <select id="filter-assignee"><option value="" data-i18n="all_assignees">All assignees</option></select>
      <div class="spacer"></div>
      <button class="btn primary" id="new-item" data-i18n="new_item">+ New work item</button>
    </div>
    <div class="board" id="board"></div>
  </section>

  <!-- BUGS -->
  <section id="view-bugs" class="hidden">
    <div class="toolbar">
      <input id="bq" data-i18n-ph="search_bug_ph" placeholder="Search bugs…" />
      <select id="b-severity"><option value="" data-i18n="all_severities">All severities</option>
        <option>critical</option><option>major</option><option>minor</option><option>trivial</option></select>
      <select id="b-status"><option value="" data-i18n="all_statuses">All statuses</option>
        <option>open</option><option>in_progress</option><option>fixed</option><option>verified</option><option>wontfix</option></select>
      <div class="spacer"></div>
      <button class="btn primary" id="new-bug" data-i18n="new_bug">+ Add bug</button>
    </div>
    <div class="panel" id="bug-list"></div>
  </section>

  <!-- DOCS -->
  <section id="view-docs" class="hidden">
    <div class="toolbar">
      <button class="btn primary" id="new-doc" data-i18n="new_doc">+ New doc</button>
    </div>
    <div class="grid2">
      <div class="panel" id="doc-list"></div>
      <div class="panel" id="doc-view"><div class="empty" data-i18n="doc_select_empty">Select a document on the left</div></div>
    </div>
  </section>

  <!-- ADMIN -->
  <section id="view-admin" class="hidden">
    <div class="panel" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0" data-i18n="project_stats">Project statistics</h2>
        <button class="btn" id="perm-toggle">Permissions</button>
      </div>
      <div class="board" id="project-stats" style="margin-top:12px"></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <h2 data-i18n="projects">Projects</h2>
        <button class="btn primary sm" id="new-project" data-i18n="new_project">+ New project</button>
        <table class="admin" style="margin-top:10px" id="project-table"></table>
      </div>
      <div class="panel">
        <h2 data-i18n="users">Users</h2>
        <button class="btn primary sm" id="new-user" data-i18n="new_user">+ Add user</button>
        <table class="admin" style="margin-top:10px" id="user-table"></table>
      </div>
    </div>
  </section>
</main>

<!-- work item modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- i18n (English + Chinese globalization) ----
const I18N = {

    login: 'Log in', logout: 'Log out', login_title: 'Log in',

    change_password_title: 'Change password', new_password: 'New password',
    password_required: 'Password required', form_password: 'Password (optional)',
  },
  zh: {
    title: 'NexPlan 项目管理',
    proj_label: '项目', tab_board: '待办板', tab_bugs: '缺陷', tab_docs: '文档', tab_admin: '管理',
    refresh: '刷新', search_wi_ph: '搜索标题/描述…',

    new_bug: '+ 录入缺陷', new_doc: '+ 新建文档', doc_select_empty: '在左侧选择一个文档',
    project_stats: '项目统计', projects: '项目', new_project: '+ 新建项目',
    users: '用户', new_user: '+ 添加用户',

    stat_todo: '待办', stat_inprog: '进行中', stat_done: '已完成', stat_bugs: '缺陷',

};

const LS_LANG = 'nexplan_lang';
const detectLang = () => {
  const saved = localStorage.getItem(LS_LANG);
  if (saved === 'en' || saved === 'zh') return saved;
  return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
};
let lang = detectLang();
const t = (key) => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
const statusLabel = (s) => (I18N.en['st_' + s] ? t('st_' + s) : s);
const fmt = (key, vars) => { let s = t(key); for (const k in (vars || {})) s = s.replace('{' + k + '}', vars[k]); return s; };
function applyI18n() {
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = t(el.getAttribute('data-i18n')); if (v) el.textContent = v; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { const v = t(el.getAttribute('data-i18n-ph')); if (v) el.setAttribute('placeholder', v); });
}
function setLang(next) {
  if (next !== 'en' && next !== 'zh') return;
  lang = next;
  localStorage.setItem(LS_LANG, next);
  document.documentElement.lang = next === 'zh' ? 'zh-CN' : 'en';
  const sel = $('#lang-select'); if (sel) sel.value = next;
  applyI18n();
  renderAuth();
  refresh();
}

let project = 'default';
const withProject = (u) => u + (u.includes('?') ? '&' : '?') + 'project=' + encodeURIComponent(project);

// Surface API/validation errors as a toast instead of failing silently.
let toastTimer = null;
function notify(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}
function notifyError(e) {
  const msg = (e && e.message) || String(e);
  console.error(msg);
  notify('Error: ' + msg);
}

const api = {
  get: (u) => fetch(u, { credentials: 'same-origin' }).then(r => { if (!r.ok) return r.json().then(x => { throw new Error(x.error || r.statusText); }); return r.json(); }).catch(e => { notifyError(e); throw e; }),
  send: (u, method, body) => fetch(u, { method, credentials: 'same-origin', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body || {}) }).then(r => { if (!r.ok) return r.json().then(x => { throw new Error(x.error || r.statusText); }); return r.json(); }).catch(e => { notifyError(e); throw e; }),
};
let board = {};
const STATUSES = ['backlog','todo','in_progress','review','done','blocked'];
const STATUS_ORDER = ['open','in_progress','fixed','verified','wontfix','reopened'];

async function initProjects() {
  const w = await api.get('/api/workspace');
  const sel = $('#project-select');
  sel.innerHTML = w.projects.map(p => `<option value="${esc(p.key)}" ${p.key===w.currentProject?'selected':''}>${esc(p.name)} (${esc(p.key)})</option>`).join('');
  project = w.currentProject || (w.projects[0] && w.projects[0].key) || 'default';
  sel.value = project;
  sel.onchange = () => { project = sel.value; refresh(); };
}

async function loadSummary() {
  board = await api.get('/api/board?project=' + encodeURIComponent(project));
  const keys = Object.entries(board.workItems);
  const wTotal = keys.reduce((a,[k,v]) => a+v, 0);
  const bTotal = board.bugs ? Object.values(board.bugs).reduce((a,v)=>a+v,0) : 0;
  $('#chips').innerHTML =
    `<span class="chip">${t('chips_wi')} <b>${wTotal}</b></span>` +

async function loadBoard() {
  const q = $('#q').value.trim();
  const pri = $('#filter-priority').value;
  const asg = $('#filter-assignee').value;
  const params = new URLSearchParams({ project });
  if (q) params.set('query', q);
  if (pri) params.set('priority', pri);
  if (asg) params.set('assignee', asg);
  const items = await api.get('/api/workitems?' + params.toString());
  const byStatus = {};
  for (const s of STATUSES) byStatus[s] = items.filter(i => i.status === s);
  const assignees = [...new Set(items.map(i => i.assignee).filter(Boolean))];
  $('#filter-assignee').innerHTML = '<option value="">' + t('all_assignees') + '</option>' +
    assignees.map(a => `<option value="${esc(a)}">@${esc(a)}</option>`).join('');
  $('#board').innerHTML = STATUSES.map(s => `
    <div class="col">
      <h3>${statusLabel(s)} <span class="count">${byStatus[s].length}</span></h3>
      ${byStatus[s].map(cardHtml).join('') || `<div class="empty">${t('board_empty')}</div>`}
    </div>`).join('');
  bindCards();
}

function cardHtml(i) {
  return `<div class="card" data-id="${esc(i.id)}">
    <div class="id">${esc(i.id)}</div>
    <div class="title">${esc(i.title)}</div>
    <div class="meta">
      <span class="badge pri-${esc(i.priority)}">${esc(i.priority)}</span>
      ${i.assignee ? `<span class="assignee">@${esc(i.assignee)}</span>` : ''}
      ${(i.tags||[]).slice(0,2).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}
    </div>
  </div>`;
}

function bindCards() {
  document.querySelectorAll('.card').forEach(c => {
    c.onclick = () => openItem(c.dataset.id);
  });
}

async function openItem(id) {
  const i = await api.get('/api/workitems/' + id + '?project=' + encodeURIComponent(project));
  const modal = $('#modal');
  modal.innerHTML = `
    <h3>${esc(i.id)} · ${esc(i.title)}</h3>
    <div class="row" style="margin-bottom:10px">
      <span class="badge pri-${esc(i.priority)}">${esc(i.priority)}</span>
      <span class="st ${esc(i.status)}">${statusLabel(i.status)}</span>
      <span class="muted">${esc(i.type)}</span>
      ${i.assignee ? `<span class="assignee">@${esc(i.assignee)}</span>` : ''}
    </div>
    ${i.description ? `<p class="muted">${esc(i.description)}</p>` : ''}
    <div class="row">
      <label style="margin:0">${t('w_status')}</label>
      <select id="w-status">${STATUSES.map(s => `<option value="${s}" ${s===i.status?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>
      <button class="btn sm" id="w-claim">${t('w_claim')}</button>
      <button class="btn sm primary" id="w-complete">${t('w_complete')}</button>
    </div>
    <label>${t('w_notes')}</label>
    <div id="w-notes">${(i.notes||[]).map(n => `<div class="note">${esc(n.body)} <span class="who">— ${esc(n.author)} ${esc(new Date(n.at).toLocaleString())}</span></div>`).join('') || `<div class="empty">${t('w_no_notes')}</div>`}</div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="note-input" placeholder="${t('w_note_ph')}" />
      <button class="btn" id="note-add">${t('w_note_add')}</button>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn" id="w-close">${t('close')}</button></div>`;
  $('.modal-bg').classList.add('open');
  $('#w-status').onchange = async (e) => {
    await api.send('/api/workitems/' + id + '?project=' + encodeURIComponent(project), 'PATCH', { status: e.target.value, author: 'user' });
    await refresh();
  };
  $('#w-claim').onclick = async () => {
    const asg = prompt(t('claim_prompt'),'user');
    if (asg) { await api.send(`/api/workitems/${id}/claim?project=${encodeURIComponent(project)}`, 'POST', { assignee: asg }); await refresh(); }
  };
  $('#w-complete').onclick = async () => {
    const note = prompt(t('complete_prompt'),'');
    await api.send(`/api/workitems/${id}/complete?project=${encodeURIComponent(project)}`, 'POST', { note: note || '', author: 'user' });
    await refresh();
  };
  $('#note-add').onclick = async () => {
    const v = $('#note-input').value.trim();
    if (!v) return;
    await api.send(`/api/workitems/${id}/note?project=${encodeURIComponent(project)}`, 'POST', { body: v, author: 'user' });
    await openItem(id); await refresh();
  };
  $('#w-close').onclick = closeModal;
}

function closeModal() { $('#modal-bg').classList.remove('open'); }

async function refresh() {
  await loadSummary();
  if (!$('#view-board').classList.contains('hidden')) await loadBoard();
  if (!$('#view-bugs').classList.contains('hidden')) await loadBugs();
  if (!$('#view-docs').classList.contains('hidden')) await loadDocsList();
  if (!$('#view-admin').classList.contains('hidden')) await loadAdmin();
}

async function loadBugs() {
  const q = $('#bq').value.trim();
  const sev = $('#b-severity').value;
  const st = $('#b-status').value;
  const params = new URLSearchParams({ project });
  if (q) params.set('query', q);

  $('#bug-list').innerHTML = bugs.map(b => `
    <div class="list-item" data-id="${esc(b.id)}">
      <div class="row">
        <span class="id" style="font-family:monospace;color:var(--accent)">${esc(b.id)}</span>
        <span class="badge sev-${esc(b.severity)}">${esc(b.severity)}</span>
        <span class="st ${esc(b.status)}">${esc(b.status)}</span>
        <b>${esc(b.title)}</b>
        ${b.foundByAgent ? `<span class="assignee">by ${esc(b.foundByAgent)}</span>` : ''}
        <div class="spacer" style="flex:1"></div>

async function openDoc(slug) {
  const s = encodeURIComponent(slug);
  const q = 'project=' + encodeURIComponent(project);
  const d = await api.get('/api/docs/' + s + '?' + q);
  const hist = await api.get('/api/docs/' + s + '/history?' + q);
  $('#doc-view').innerHTML = `
    <div class="row">
      <h2 style="margin:0">${esc(d.meta.title)}</h2>
      <span class="muted">${esc(slug)} · v${d.meta.version}</span>
      <span class="st">${esc(d.meta.status)}</span>
    </div>
    <div class="row" style="margin:10px 0">
      <button class="btn sm" id="doc-edit">${t('doc_edit')}</button>
      <button class="btn sm" id="doc-status">${t('doc_approve')}</button>
    </div>
    <div class="doc-body" id="doc-content">${esc(d.content)}</div>
    <h3 style="margin:16px 0 8px">${t('doc_history')}</h3>
    <div class="doc-body" style="min-height:auto">${hist.map(v => `v${v.version} · ${v.sha.slice(0,8)} · ${esc(v.author)} · ${esc(new Date(v.date).toLocaleString())}<br>${esc(v.message)}`).join('<br><br>') || t('doc_no_versions')}</div>`;
  $('#doc-edit').onclick = () => editDoc(slug, d.content);
  $('#doc-status').onclick = async () => {
    await api.send('/api/docs/' + s + '?' + q, 'PATCH', { status: 'approved', author: 'user' });
    await openDoc(slug); await refresh();
  };
}

function editDoc(slug, content) {
  const modal = $('#modal');
  modal.innerHTML = `
    <h3>${t('doc_edit_title')}</h3>
    <label>${t('doc_content')}</label>
    <textarea id="doc-body">${esc(content)}</textarea>

    await api.send('/api/docs/' + encodeURIComponent(slug) + '?project=' + encodeURIComponent(project), 'PATCH', { content: $('#doc-body').value, author: 'user' });

// ---------------- admin (projects & users) ----------------
async function loadAdmin() {
  const w = await api.get('/api/workspace');
  const projects = w.projects, users = w.users;

  // Per-project statistics cards.
  const stats = await api.get('/api/projects/stats');
  $('#project-stats').innerHTML = stats.map(p => {
    const s = p.summary || {};
    const done = s.workItems?.done || 0, inprog = s.workItems?.in_progress || 0;
    const backlog = (s.totalWorkItems||0) - done - inprog;
    const openBugs = s.bugs?.open || 0;
    const memberCount = (p.members||[]).length;
    return `<div class="col" data-key="${esc(p.key)}" style="cursor:pointer">
      <h3>${esc(p.key)} <span class="count">${esc(p.name)}</span></h3>
      <div class="card"><div class="title">${t('stat_todo')} <b>${backlog}</b> · ${t('stat_inprog')} <b>${inprog}</b> · ${t('stat_done')} <b>${done}</b></div>
        <div class="meta"><span class="badge sev-critical">${t('stat_bugs')} ${openBugs}</span><span class="muted">${t('stat_docs')} ${s.docs||0}</span><span class="muted">${t('stat_members')} ${memberCount}</span></div></div>
    </div>`;
  }).join('') || `<div class="empty">${t('stat_empty')}</div>`;
  document.querySelectorAll('#project-stats .col').forEach(c => c.onclick = () => {
    project = c.dataset.key; $('#project-select').value = project; showTab('board');
  });

  // Permission toggle button.
  const pt = $('#perm-toggle');
  pt.textContent = t('perm_prefix') + (w.enforcePermissions ? t('perm_strict') : t('perm_loose'));
  pt.onclick = async () => {
    const next = !w.enforcePermissions;
    await api.send('/api/workspace/enforce-permissions', 'POST', { value: next });
    await loadAdmin(); await refresh();
  };

  $('#project-table').innerHTML = `<tr><th>Key</th><th>${t('col_name')}</th><th>${t('col_members')}</th><th></th></tr>` +
    projects.map(p => `<tr>
      <td>${esc(p.key)}${p.key===w.currentProject ? ' <span class="st">default</span>' : ''}</td>
      <td>${esc(p.name)}</td><td>${esc((p.members||[]).join(', '))||'-'}</td>
      <td style="white-space:nowrap">
        ${p.key!=='default' ? `<button class="btn sm" data-del-proj="${esc(p.key)}">${t('col_del')}</button>` : ''}
        ${p.key!==w.currentProject ? `<button class="btn sm" data-use-proj="${esc(p.key)}">${t('set_default')}</button>` : ''}
      </td></tr>`).join('');
  document.querySelectorAll('[data-del-proj]').forEach(b => b.onclick = async () => {
    if (confirm(fmt('confirm_del_proj', { x: b.dataset.delProj }))) { await api.send('/api/projects/' + encodeURIComponent(b.dataset.delProj), 'DELETE'); await refresh(); }
  });
  document.querySelectorAll('[data-use-proj]').forEach(b => b.onclick = async () => {
    await api.send('/api/workspace/default-project', 'POST', { key: b.dataset.useProj });
    await initProjects(); await refresh();
  });

  $('#user-table').innerHTML = `<tr><th>ID</th><th>${t('col_name')}</th><th>Type</th><th>Role</th><th></th></tr>` +
    users.map(u => `<tr>
      <td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${u.kind}</td>
      <td><select class="role" data-user="${esc(u.id)}">${['admin','member','viewer'].map(r => `<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></td>
      <td><button class="btn sm danger" data-del-user="${esc(u.id)}">${t('col_del')}</button></td></tr>`).join('');
  document.querySelectorAll('.role').forEach(sel => sel.onchange = async () => {
    await api.send('/api/users/' + encodeURIComponent(sel.dataset.user), 'PATCH', { role: sel.value });
    await loadAdmin();
  });
  document.querySelectorAll('[data-del-user]').forEach(b => b.onclick = async () => {
    if (confirm(fmt('confirm_del_user', { x: b.dataset.delUser }))) { await api.send('/api/users/' + encodeURIComponent(b.dataset.delUser), 'DELETE'); await loadAdmin(); }
  });
}

  } else {
    li.style.display = 'inline-flex';
    li.classList.add('primary');
    who.style.display = 'none';
    lo.style.display = 'none';
  }
}
async function checkAuth() {
  try {
    const r = await api.get('/api/auth/me');
    currentUser = r && r.user ? r.user : null;
  } catch {
    currentUser = null;
  }
  renderAuth();
  return currentUser;
}

function loginForm() {
  modalShell(`
    <h3>${t('login_title')}</h3>
    <label>${t('login_id')}</label><input type="text" id="login-id" autocomplete="username" />
    <label>${t('login_password')}</label><input type="password" id="login-password" autocomplete="current-password" />
    <div class="row" style="margin-top:12px"><button class="btn" id="login-cancel">${t('cancel')}</button>
      <button class="btn primary" id="login-submit">${t('login')}</button></div>`);
  $('#login-cancel').onclick = closeModalX;
  $('#login-submit').onclick = async () => {
    const id = $('#login-id').value.trim();
    const pw = $('#login-password').value;
    if (!id || !pw) return notifyError(t('password_required'));
    try {
      const r = await api.send('/api/auth/login', 'POST', { id, password: pw });
      currentUser = r.user;
      closeModalX();
      renderAuth();
      if (r.user && r.user.mustChangePassword) changePasswordForm();
      else refresh();
    } catch (e) { /* error toasted by api.send */ }
  };
}

function changePasswordForm() {
  modalShell(`
    <h3>${t('change_password_title')}</h3>
    <p class="muted">${t('login_hint')}</p>
    <label>${t('new_password')}</label><input type="password" id="cp-password" autocomplete="new-password" />
    <div class="row" style="margin-top:12px"><button class="btn primary" id="cp-save">${t('save')}</button></div>`);
  $('#cp-save').onclick = async () => {
    const pw = $('#cp-password').value;
    if (!pw) return notifyError(t('password_required'));
    try {
      await api.send('/api/auth/change-password', 'POST', { password: pw });
      if (currentUser) currentUser.mustChangePassword = false;
      closeModalX();
      renderAuth();
      refresh();
    } catch (e) { /* error toasted by api.send */ }
  };
}

// ---------------- wiring ----------------
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  ['board','bugs','docs','admin'].forEach(v => $('#view-' + v).classList.toggle('hidden', name !== v));
  refresh();
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => showTab(t.dataset.tab));
$('#refresh').onclick = refresh;
$('#new-item').onclick = newItemForm;
$('#new-bug').onclick = newBugForm;
$('#new-doc').onclick = newDocForm;
$('#new-project').onclick = newProjectForm;
$('#new-user').onclick = newUserForm;
$('#lang-select').onchange = (e) => setLang(e.target.value);
$('#login-btn').onclick = loginForm;
$('#logout-btn').onclick = async () => {
  try { await api.send('/api/auth/logout', 'POST', {}); } catch (e) { /* ignore */ }
  currentUser = null;
  renderAuth();
  refresh();
};
$('#modal-bg').onclick = (e) => { if (e.target === e.currentTarget) closeModal(); };
$('#q').oninput = debounce(loadBoard, 300);
$('#bq').oninput = debounce(loadBugs, 300);
$('#filter-priority').onchange = loadBoard;
$('#filter-assignee').onchange = loadBoard;
$('#b-severity').onchange = loadBugs;
$('#b-status').onchange = loadBugs;

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
$('#lang-select').value = lang;
applyI18n();
initProjects().then(refresh);
checkAuth().then((u) => { if (u && u.mustChangePassword) changePasswordForm(); });
setInterval(() => { if (!document.hidden) refresh(); }, 15000);
</script>
